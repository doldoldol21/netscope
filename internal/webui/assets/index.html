<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>netscope</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<div class="panel">
  <header class="drag">
    <img class="logo" src="favicon.svg" alt="" />
    <span class="brand">netscope</span>
    <span class="spacer"></span>
    <span class="dot" id="dot"></span>
    <button class="meta" id="meta" aria-label="Capture interface" data-i18n="status.connecting"
            data-i18n-aria="tip.captureIface" data-i18n-tip="tip.captureIface" data-tip="Capture interface" data-tip-down>connecting…</button>
    <button class="iconbtn" id="pause-btn" aria-label="Pause capture"
            data-i18n-aria="tip.pause" data-i18n-tip="tip.pause" data-tip="Pause capture" data-tip-down>⏸</button>
  </header>
  <div class="iface-menu" id="iface-menu" hidden></div>

  <button class="updbanner" id="updbanner" hidden>
    <span class="ub-txt" data-i18n="pop.updateAvailable">Update available</span>
    <span class="ub-go" data-i18n="pop.updateGo">Update ↻</span>
  </button>

  <section class="rates">
    <div class="rate down">
      <div class="line"><span class="arrow">▼</span><span class="v" id="rx">0</span></div>
      <div class="lbl" data-i18n="download">download</div>
    </div>
    <div class="rate up">
      <div class="line"><span class="arrow">▲</span><span class="v" id="tx">0</span></div>
      <div class="lbl" data-i18n="upload">upload</div>
    </div>
  </section>

  <div class="today">
    <span class="t-cap" data-i18n="pop.today">Today</span>
    <span class="t-total" id="t-total">—</span>
    <span class="t-split" id="t-split"></span>
  </div>

  <canvas id="spark"></canvas>

  <div class="section-head">
    <span data-i18n="pop.topApps">Top apps</span><span class="hint" id="active"></span>
  </div>
  <ul class="apps" id="apps"></ul>

  <footer>
    <button class="primary" id="dash" aria-label="Open Dashboard" data-i18n-aria="pop.openDash"><span data-i18n="pop.openDash">Open Dashboard</span> <span class="ext">↗</span></button>
    <button class="ghost" id="alerts-btn" aria-label="Settings"
            data-i18n-aria="tip.settings" data-i18n-tip="tip.settings" data-tip="Settings">⚙</button>
    <button class="ghost" id="quit" aria-label="Quit netscope"
            data-i18n-aria="tip.quit" data-i18n-tip="tip.quit" data-tip="Quit">⏻</button>
  </footer>

  <div class="settings" id="settings">
    <div class="set-head">
      <span data-i18n="set.title">Settings</span>
      <button class="x" id="set-close" title="Close">✕</button>
    </div>

    <div class="set-body">
      <div class="set-sub" data-i18n="set.alerts">Alerts</div>
      <p class="set-hint" data-i18n="set.alertsHint">Notify when today's usage crosses a daily limit, in GB. 0 = off.
        Upload-only watches data leaving your Mac (backups, cloud sync).</p>
      <div class="alert-grid">
        <span></span>
        <span class="ag-head"><span data-i18n="set.totalHead">↓↑ Total</span><small>GB</small></span>
        <span class="ag-head up"><span data-i18n="set.uploadHead">↑ Upload</span><small>GB</small></span>

        <span class="set-lbl" data-i18n="set.allApps">All apps</span>
        <input type="number" id="set-daily" min="0" step="0.5" placeholder="0" />
        <input type="number" id="set-up-daily" min="0" step="0.5" placeholder="0" />

        <span class="set-lbl" data-i18n="set.oneApp">One app</span>
        <input type="number" id="set-app" min="0" step="0.5" placeholder="0" />
        <input type="number" id="set-up-app" min="0" step="0.5" placeholder="0" />
      </div>

      <div class="set-sub" data-i18n="set.appearance">Appearance</div>
      <label class="set-row">
        <span class="set-lbl" data-i18n="set.theme">Theme</span>
        <select id="set-theme" class="set-sel">
          <option value="auto" data-i18n="set.followSystem">Follow system</option>
          <option value="light" data-i18n="set.light">Light</option>
          <option value="dark" data-i18n="set.dark">Dark</option>
        </select>
      </label>

      <div class="set-sub" data-i18n="set.menubar">Menu bar</div>
      <label class="set-row">
        <span class="set-lbl" data-i18n="set.rateDisplay">Rate display</span>
        <select id="set-menubar" class="set-sel"></select>
      </label>
      <label class="set-row">
        <span class="set-lbl" data-i18n="set.color">Color ↓ / ↑</span>
        <input type="checkbox" id="set-menubar-color" class="set-chk" />
      </label>
      <label class="set-row">
        <span class="set-lbl" data-i18n="set.anim">Animate icon</span>
        <input type="checkbox" id="set-menubar-anim" class="set-chk" />
      </label>

      <div class="set-sub" data-i18n="set.updates">Updates</div>
      <label class="set-row">
        <span class="set-lbl" data-i18n="set.autocheck">Check automatically</span>
        <input type="checkbox" id="set-autocheck" class="set-chk" />
      </label>
      <div class="set-row">
        <span class="set-lbl upd-status" id="upd-status">—</span>
        <button class="mini" id="upd-check" data-i18n="set.checkNow">Check now</button>
      </div>
      <button class="primary upd-now" id="upd-now" hidden data-i18n="upd.now">Update &amp; Restart</button>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="tooltip.js"></script>
<script src="panel.js"></script>
</body>
</html>
