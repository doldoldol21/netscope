version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/internal/webui/uitest"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
