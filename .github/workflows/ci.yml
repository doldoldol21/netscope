name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # macOS is the real target: this exercises the cgo/libpcap + Cocoa builds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      # The stored history is keyed by local midnight, so the storage layer is
      # timezone-sensitive by construction: a shipped release once mis-keyed a
      # whole backfill because Go and SQLite disagreed about what "midnight"
      # meant. These zones cover a negative offset with DST, a positive one, no
      # offset, and a half-hour offset with a 30-minute DST shift.
      - name: test storage across timezones
        run: |
          # Havana/Santiago/Beirut/Cairo shift AT midnight (that local day has no
          # 00:00), Lord_Howe and Chatham shift by 30 or 45 minutes, New_York has
          # the 25-hour fall-back day that once double-counted an hour.
          for tz in America/New_York America/Havana America/Santiago Asia/Beirut \
                    Africa/Cairo Australia/Lord_Howe Pacific/Chatham \
                    Europe/Berlin UTC Asia/Seoul; do
            echo "== TZ=$tz"
            TZ=$tz go test -count=1 ./internal/storage/ ./internal/engine/ ./internal/api/ || exit 1
          done

      # The named zones above pin calendar semantics, but they cannot pin the
      # other timezone axis: where in its local day a run happens to land. Tests
      # that write a sample at a fixed offset into today and then read up to
      # time.Now() only break while now is still earlier than that offset — a
      # window near local midnight that these runners, being UTC, drift through
      # unpredictably. Every whole-hour offset is covered instead, so whenever
      # CI runs, some zone is in the small hours and the failure is deterministic.
      - name: test storage in every hour offset
        run: |
          for n in $(seq -12 14); do
            if [ "$n" -eq 0 ]; then tz=UTC
            elif [ "$n" -gt 0 ]; then tz="Etc/GMT-$n"
            else tz="Etc/GMT+$(( -n ))"
            fi
            echo "== TZ=$tz (local $(TZ=$tz date +%H:%M))"
            TZ=$tz go test -count=1 ./internal/storage/ || exit 1
          done

  linux:
    # Cross-platform sanity: pure Go packages compile and pass tests on Linux.
    # Now includes real capture (libpcap) and resolver (/proc) implementations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
